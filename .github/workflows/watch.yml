name: distributor-watch

# run-name distinguishes bridge hops from scanning runs so skip_if_other_run.sh
# and should_bridge.sh can count them separately (see concurrency below).
run-name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bridge == 'true' && 'distributor-watch-bridge' || 'distributor-watch' }}

# 24/7 MODE (since 2026-11-14): the watch scans every 5 minutes around the
# clock, every day, with no off-hours window (watch.window.ALWAYS_ON = True).
# Webhook/email still fire only when something actually changes.
#
# GitHub cron is UTC-only and best-effort. It is not a reliable 5-minute
# timer (a */5 schedule was throttled to ~20 minutes, and a */20 schedule
# missed slots entirely), so cadence cannot depend on cron.
#
# Primary cadence: each scanning job loops every 5 minutes for ~55 minutes,
# commits state after each pass, then triggers the next run with
# `gh workflow run` (GITHUB_TOKEN is allowed to fire workflow_dispatch).
# In 24/7 mode should_chain is always true, so the chain never stops and no
# overnight/weekend bridge is dispatched. The bridge job (workflow_dispatch
# input bridge=true) is kept only for the legacy weekday window; if one is
# ever started now, bridge_plan returns an immediate loop=true dispatch
# (and skip_if_other_run.sh drops it if a scanning chain is already going).
#
# Cron is only a backup restarter: every 30 minutes, every hour, every day
# (UTC; no DST edits needed). A backup cron that lands while the chain is
# running exits immediately via skip_if_other_run.sh.
#
# Public repo = unlimited free Actions minutes. 24/7 scanning is ~1,440
# runner-minutes/day (~10,000/week), free only while the repo is public.
# Do not make this repo private; that would burn far past the 2,000 free
# private minutes/month.
"on":
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside the watch window (no effect in 24/7 mode)"
        type: boolean
        default: false
      dry_run:
        description: "Print the payload instead of POSTing to the webhook"
        type: boolean
        default: false
      loop:
        description: "Loop every 5 minutes for ~55 minutes (on by default for scheduled runs)"
        type: boolean
        default: false
      bridge:
        description: "Legacy overnight wait for the weekday window; in 24/7 mode it dispatches a loop immediately"
        type: boolean
        default: false

# Scanning runs and bridge hops use separate concurrency groups so a
# long-sleeping bridge cannot queue, replace, or block a scanning run.
# cancel-in-progress stays false so a backup cron never kills a live loop
# and a second bridge never kills a sleeping one. GitHub keeps at most
# one pending run per group; skip_if_other_run.sh also exits immediately
# if another comparable run is in_progress or queued, so a 4:00 AM cron
# and a bridge-dispatched loop cannot both become scanning chains, and
# two bridges cannot both sleep.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bridge == 'true' && 'distributor-watch-bridge' || 'distributor-watch' }}
  cancel-in-progress: false

permissions:
  contents: write   # to commit updated state/ back
  actions: write    # to dispatch the next run with GITHUB_TOKEN

jobs:
  watch:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.bridge != 'true' }}
    runs-on: ubuntu-latest
    # 55-min loop + checkout/setup/dispatch buffer.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          # Enough history for commit_state.sh to rebase over recent state commits.
          fetch-depth: 50

      - name: Skip if another run is already going
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_BRIDGE: "false"
        run: bash tools/skip_if_other_run.sh

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      # Private state (ASM dealer price list, Gmail ids seen) never goes in the
      # public repo; it is carried between runs in the Actions cache instead.
      # The dir is created so a first run without Gmail/ASM does not trip a
      # "Path Validation Error" / "Cache save failed" warning. Save is skipped
      # when the dir is still empty (hashFiles == '').
      - name: Ensure private state dir
        if: steps.gate.outputs.skip != 'true'
        run: mkdir -p state/private

      - name: Restore private state
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: state/private
          key: private-state-${{ github.run_id }}
          restore-keys: private-state-

      - name: Install pdftotext (poppler-utils)
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null

      - name: Run watch
        if: steps.gate.outputs.skip != 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WATCH_WEBHOOK_URL: ${{ secrets.WATCH_WEBHOOK_URL }}
          WATCH_WEBHOOK_TOKEN: ${{ secrets.WATCH_WEBHOOK_TOKEN }}
          WATCH_WEBHOOK_HEADER: ${{ vars.WATCH_WEBHOOK_HEADER || 'Authorization' }}
          TZ: America/Chicago
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          LOOP=0
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.loop }}" = "true" ]; then
            LOOP=1
          fi
          WATCH_ARGS="$ARGS" LOOP="$LOOP" LOOP_SECS=3300 bash tools/run_loop.sh

      - name: Save private state
        if: success() && steps.gate.outputs.skip != 'true' && hashFiles('state/private/**') != ''
        uses: actions/cache/save@v4
        with:
          path: state/private
          key: private-state-${{ github.run_id }}

      - name: Trigger the next run
        if: success() && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if bash tools/should_chain.sh; then
            echo "Inside the watch window (24/7); dispatching the next run"
            ARGS="-f loop=true"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS -f dry_run=true"
            fi
            # GITHUB_TOKEN is allowed to trigger workflow_dispatch.
            gh workflow run watch.yml --ref main $ARGS
          elif bash tools/should_bridge.sh; then
            echo "Window closed; dispatching an overnight bridge to the next 4 AM CT start"
            gh workflow run watch.yml --ref main -f bridge=true
          else
            echo "Not dispatching a follow-on run (outside the window and a bridge is already going, or the window check failed)"
          fi

  bridge:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bridge == 'true' }}
    runs-on: ubuntu-latest
    # 5h30m sleep + checkout/plan/dispatch buffer, and up to 2 minutes of
    # early-wake slack, under the 6-hour (360 min) Actions job limit.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          # Only tools/ and watch/window.py are needed; no state history.
          fetch-depth: 1

      - name: Skip if another bridge is already going
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_BRIDGE: "true"
        run: bash tools/skip_if_other_run.sh

      - name: Sleep until the next hop, then dispatch
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/run_bridge.sh
