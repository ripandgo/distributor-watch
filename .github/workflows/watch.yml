name: distributor-watch

# GitHub cron is UTC-only and best-effort. A */5 schedule was throttled
# to about every 20 minutes (runs at 23:36Z manual, then 00:33Z, 00:53Z).
# Schedule every 20 minutes and loop inside the job every 5 minutes so the
# scan cadence stays 5 minutes. The two UTC lines still cover BOTH Central
# offsets, with the in-code window guard (watch/__main__.py: in_window)
# dropping the extra hour each side:
#   CDT (UTC-5, Mar-Nov): 5:00-21:55 CT = 10:00-02:55 UTC
#   CST (UTC-6, Nov-Mar): 5:00-21:55 CT = 11:00-03:55 UTC
# Union = 10:00-23:59 UTC Mon-Fri, plus 00:00-03:59 UTC Tue-Sat
# (= Mon-Fri evening CT). DST changes need no edits here.
#
# Public repo = unlimited free Actions minutes, so a ~18-20 min job is fine.
# Do not make this repo private; that would burn ~1,000 min/day.
on:
  schedule:
    - cron: "*/20 10-23 * * 1-5"
    - cron: "*/20 0-3 * * 2-6"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside the 5 AM-10 PM weekday window"
        type: boolean
        default: false
      dry_run:
        description: "Print the payload instead of POSTing to the webhook"
        type: boolean
        default: false
      loop:
        description: "Loop every 5 minutes for the 20-minute window (on by default for scheduled runs)"
        type: boolean
        default: false

# One run at a time; a run that starts while another is going waits
# (GitHub keeps at most one pending run, extra ones are dropped, which is fine).
concurrency:
  group: distributor-watch
  cancel-in-progress: false

permissions:
  contents: write   # to commit updated state/ back

jobs:
  watch:
    runs-on: ubuntu-latest
    # 18-min loop + checkout/setup buffer; leaves ~2 min before the next
    # 20-min scheduled job so the two do not overlap.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Private state (ASM dealer price list, Gmail ids seen) never goes in the
      # public repo; it is carried between runs in the Actions cache instead.
      # The dir is created so a first run without Gmail/ASM does not trip a
      # "Path Validation Error" / "Cache save failed" warning. Save is skipped
      # when the dir is still empty (hashFiles == '').
      - name: Ensure private state dir
        run: mkdir -p state/private

      - name: Restore private state
        uses: actions/cache/restore@v4
        with:
          path: state/private
          key: private-state-${{ github.run_id }}
          restore-keys: private-state-

      - name: Install pdftotext (poppler-utils)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null

      - name: Run watch
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WATCH_WEBHOOK_URL: ${{ secrets.WATCH_WEBHOOK_URL }}
          WATCH_WEBHOOK_TOKEN: ${{ secrets.WATCH_WEBHOOK_TOKEN }}
          WATCH_WEBHOOK_HEADER: ${{ vars.WATCH_WEBHOOK_HEADER || 'Authorization' }}
          TZ: America/Chicago
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          LOOP=0
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.loop }}" = "true" ]; then
            LOOP=1
          fi
          WATCH_ARGS="$ARGS" LOOP="$LOOP" LOOP_SECS=1080 bash tools/run_loop.sh

      - name: Save private state
        if: success() && hashFiles('state/private/**') != ''
        uses: actions/cache/save@v4
        with:
          path: state/private
          key: private-state-${{ github.run_id }}
